<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ACE EXPO｜管理ページ</title>
<meta name="robots" content="noindex,nofollow">
<meta name="description" content="ACE EXPO管理ページ">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Roboto:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --chalk:#F2F3EF; --paper:#FFFFFF; --ink:#131A2B;
    --mat:#1C2A4E; --score:#FFB627; --line:#06C755;
    --muted:#7C8598; --hair:#E2E3DE; --sold:#B4462F; --ok:#1F7A4D;
    --display:"Oswald",sans-serif;
    --jp:"Zen Kaku Gothic New",sans-serif;
    --mono:"Roboto","Zen Kaku Gothic New",sans-serif;   /* 0に斜線が入らない書体 */
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{background:var(--chalk);color:var(--ink);font-family:var(--jp);line-height:1.7;
    -webkit-font-smoothing:antialiased;
    font-feature-settings:"tnum" 1;padding-bottom:60px}
  button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
  :focus-visible{outline:3px solid var(--mat);outline-offset:2px}
  .wrap{max-width:760px;margin:0 auto;padding:0 20px}

  /* header */
  .top{position:sticky;top:0;z-index:30;background:var(--mat);color:#fff}
  .top-in{max-width:760px;margin:0 auto;padding:13px 20px;display:flex;
    align-items:center;justify-content:space-between;gap:14px}
  .mark{font-family:var(--display);font-weight:700;font-size:20px;letter-spacing:.06em;line-height:1.15}
  .mark span{display:block;font-family:var(--jp);font-size:10px;font-weight:500;
    letter-spacing:.16em;color:#8FA0C4;margin-top:3px}
  .reload{background:var(--score);color:var(--ink);font-weight:900;font-size:12.5px;
    padding:9px 14px;border-radius:999px;flex:none}
  .reload[disabled]{opacity:.55}
  .tabs{background:var(--mat);border-top:1px solid rgba(255,255,255,.12)}
  .tabs-in{max-width:760px;margin:0 auto;padding:0 20px;display:flex;gap:22px}
  .tab{padding:11px 0 9px;font-size:13px;font-weight:700;color:#8FA0C4;
    border-bottom:2px solid transparent;margin-bottom:-1px}
  .tab[aria-selected="true"]{color:#fff;border-bottom-color:var(--score)}
  .stamp{font-size:10.5px;color:#8FA0C4;text-align:right;padding:6px 20px 0;max-width:760px;margin:0 auto}

  /* cards */
  .sec{margin-top:26px}
  .sec-head{display:flex;align-items:center;gap:11px;padding-bottom:9px;border-bottom:2px solid var(--ink)}
  .chip{width:13px;height:13px;background:var(--score);flex:none;border-radius:2px}
  .sec-head h2{font-family:var(--display);font-weight:700;font-size:15px;letter-spacing:.14em}
  .sec-head small{font-size:11.5px;color:var(--muted);font-weight:500}

  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-top:14px}
  .kpi{background:var(--paper);border:1px solid var(--hair);border-radius:12px;padding:14px 15px}
  .kpi .l{font-size:11px;color:var(--muted);font-weight:700;letter-spacing:.04em}
  .kpi .v{font-family:var(--mono);font-weight:700;font-size:25px;line-height:1.3;
    font-variant-numeric:tabular-nums;margin-top:3px}
  .kpi .s{font-size:11px;color:var(--muted)}
  .vsplit td.vn{font-weight:900}
  .vsplit tr.fuwa td{background:#FFF7E3}
  .vsplit tr.ace td{background:#EEF4FF}
  .vtag{display:inline-block;margin-left:6px;padding:0 5px;border-radius:4px;background:#E6F0FF;color:#1C5BC4;font-size:10.5px;font-weight:700}
  h3.subh{margin:18px 0 8px;font-size:13px;font-weight:900}
  h3.subh.ace{color:#1C5BC4}
  .kpi.alert{border-color:var(--sold);background:#FDECE8}
  .kpi.alert .v,.kpi.alert .l{color:var(--sold)}

  .slotcard{background:var(--paper);border:1px solid var(--hair);border-radius:13px;
    padding:16px;margin-top:12px}
  .slotcard .row1{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
  .slotcard h3{font-size:16px;font-weight:900}
  .slotcard .time{font-family:var(--mono);font-size:12px;color:var(--muted);margin-top:2px}
  .slotcard .nums{font-family:var(--mono);font-weight:700;text-align:right;flex:none}
  .slotcard .nums b{font-size:22px}
  .slotcard .nums span{font-size:11px;color:var(--muted);display:block}
  .gauge{height:9px;border-radius:99px;background:#E7E8E3;margin-top:12px;overflow:hidden}
  .gauge i{display:block;height:100%;background:var(--mat);border-radius:99px}
  .gauge.full i{background:var(--sold)}
  .ages{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
  .age{font-size:11.5px;background:var(--chalk);border-radius:7px;padding:5px 9px;font-weight:700}
  .age b{font-family:var(--mono);margin-left:4px}

  /* table */
  .tablewrap{margin-top:14px;overflow-x:auto;-webkit-overflow-scrolling:touch;
    border:1px solid var(--hair);border-radius:12px;background:var(--paper)}
  table{width:100%;border-collapse:collapse;font-size:13px;white-space:nowrap}
  th{background:var(--mat);color:#fff;font-size:11px;font-weight:700;letter-spacing:.04em;
    padding:9px 11px;text-align:left;position:sticky;top:0}
  td{padding:10px 11px;border-top:1px solid var(--hair);vertical-align:middle}
  td.num{font-family:var(--mono);font-variant-numeric:tabular-nums;text-align:right}
  td.no{font-family:var(--mono);font-weight:700}
  tr.off{opacity:.45}
  tr.off td.no{text-decoration:line-through}
  .wrapcell{white-space:normal;min-width:190px;font-size:12px;color:#39415A}

  .pill{font-size:11px;font-weight:700;border-radius:6px;padding:3px 7px;border:1px solid currentColor}
  .pill.no{color:var(--sold)}
  .pill.yes{color:var(--ok)}
  .mini{font-size:11.5px;font-weight:700;border:1px solid var(--mat);border-radius:8px;
    padding:6px 10px;background:var(--paper);white-space:nowrap}
  .mini.warn{border-color:var(--sold);color:var(--sold)}
  .mini[disabled]{opacity:.45}

  .xlsx{display:block;width:100%;margin-top:14px;padding:14px;border-radius:12px;
    background:#1F7A4D;color:#fff;font-weight:900;font-size:14.5px;text-align:center}
  .xlsx:active{transform:scale(.99)}
  .xlsx[disabled]{opacity:.55}
  .pdfbtn{display:block;width:100%;margin-top:12px;padding:13px;border-radius:12px;
    background:var(--mat);color:#fff;font-weight:900;font-size:14px;text-align:center}
  .pdfbtn:active{transform:scale(.99)}
  .search{width:100%;margin-top:14px;padding:12px 14px;border:1px solid var(--hair);
    border-radius:11px;background:var(--paper);font-size:16px;font-family:var(--jp)}
  .empty{padding:26px;text-align:center;color:var(--muted);font-size:12.5px}

  /* settings */
  .setrow{background:var(--paper);border:1px solid var(--hair);border-radius:11px;
    padding:13px 15px;margin-top:9px}
  .setrow dt{font-size:11px;color:var(--muted);font-weight:700;letter-spacing:.04em}
  .setrow dd{font-size:14px;margin-top:3px;word-break:break-word}
  .hint{margin-top:16px;font-size:12px;color:#4C5468;background:#FFF6E2;border-radius:10px;padding:12px 14px}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(140%);
    background:var(--ink);color:#fff;font-size:13px;font-weight:700;padding:12px 20px;
    border-radius:999px;z-index:80;transition:transform .25s;white-space:nowrap}
  .toast.on{transform:translateX(-50%) translateY(0)}
  .toast.bad{background:var(--sold)}

  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
  @media print{
    .top,.tabs,.search,.mini,.reload{display:none!important}
    body{background:#fff;padding:0}
  }

  /* ---- 処理中オーバーレイ（書き込み中は全操作をブロック） ---- */
  .busy{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;
    background:rgba(19,26,43,.62);-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px);
    overscroll-behavior:contain;touch-action:none}
  .busy.on{display:flex;animation:busyIn .2s .15s both}   /* 一瞬で終わる処理ではチラつかせない */
  .busy-card{background:var(--paper);border-radius:16px;padding:26px 30px;min-width:220px;max-width:calc(100vw - 48px);
    text-align:center;box-shadow:0 12px 40px rgba(0,0,0,.28)}
  .busy-spin{width:42px;height:42px;margin:0 auto 14px;border-radius:50%;
    border:4px solid var(--hair);border-top-color:var(--score);animation:busySpin .8s linear infinite}
  .busy-msg{font-size:15px;font-weight:900;color:var(--ink)}
  .busy-sub{font-size:12px;color:var(--muted);margin-top:4px}
  @keyframes busySpin{to{transform:rotate(360deg)}}
  @keyframes busyIn{from{opacity:0}to{opacity:1}}
  @media (prefers-reduced-motion:reduce){.busy-spin{animation-duration:2.4s}.busy.on{animation:none}}

  /* ---- 読み込み失敗画面（サンプルは表示しない） ---- */
  .loaderr{position:fixed;inset:0;z-index:90;display:none;align-items:center;justify-content:center;
    background:var(--chalk);padding:24px}
  .loaderr.on{display:flex}
  .loaderr-card{background:var(--paper);border:1px solid var(--hair);border-radius:16px;padding:28px 24px;
    max-width:380px;width:100%;text-align:center}
  .loaderr h2{font-size:17px;font-weight:900;color:var(--ink)}
  .loaderr button{margin-top:18px;width:100%;min-height:50px;border:0;border-radius:12px;cursor:pointer;
    background:var(--score);color:var(--ink);font-family:var(--jp);font-weight:900;font-size:16px}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body>


<!-- ===== 読み込み失敗画面 ===== -->
<div class="loaderr" id="loaderr" role="alert">
  <div class="loaderr-card">
    <h2>読み込めませんでした</h2>
    <button type="button" id="loaderr-retry">更新</button>
  </div>
</div>

<!-- ===== 処理中オーバーレイ ===== -->
<div class="busy" id="busy" role="alertdialog" aria-modal="true" aria-live="assertive" aria-labelledby="busy-msg">
  <div class="busy-card">
    <div class="busy-spin" aria-hidden="true"></div>
    <p class="busy-msg" id="busy-msg">処理しています…</p>
    <p class="busy-sub">そのままお待ちください</p>
  </div>
</div>

<!-- ===== 本体 ===== -->
<div id="app">
  <header class="top">
    <div class="top-in">
      <div class="mark" id="mark">ACE EXPO<span id="mark-sub">管理ページ</span></div>
      <button class="reload" id="reload">更新</button>
    </div>
    <div class="tabs">
      <div class="tabs-in" role="tablist">
        <button class="tab" id="t-visit" role="tab" aria-selected="true">来場予約</button>
        <button class="tab" id="t-order" role="tab" aria-selected="false">ふわこっぺ</button>
        <button class="tab" id="t-config" role="tab" aria-selected="false">設定</button>
      </div>
    </div>
    <p class="stamp" id="stamp"></p>
  </header>

  <main class="wrap">
    <div id="p-visit"></div>
    <div id="p-order" hidden></div>
    <div id="p-config" hidden></div>
  </main>
</div>

<div class="toast" id="toast"></div>

<script>
/* =========================================================================
   ACE EXPO 管理ページ
   GAS_URL は申込ページと同じ /exec URL を貼ってください。
   GAS のスクリプトプロパティに ADMIN_KEY を設定すると、初回に管理キーを聞かれます。
   （入力したキーはこの端末に保存されます。未設定なら従来どおりキーなしで開けます）
   ========================================================================= */
const GAS_URL = "https://script.google.com/macros/s/AKfycbwwj-7s7ZtKnaPFG7IZnedg57mWKueImwus48gmqfoiNrc_CS8ou2AmHp-1r3Db_yT-3w/exec";   // ← GASの /exec URL を貼る

let DATA = null;

const yen = n => "¥" + Number(n || 0).toLocaleString("ja-JP");
const esc = s => String(s == null ? "" : s)
  .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");

/* ---------- 管理キー ---------- */
const KEY_STORE = "aceexpo_admin_key";
const adminKey = () => { try{ return localStorage.getItem(KEY_STORE) || ""; }catch(e){ return ""; } };


/* ---------- 通信 ---------- */
/** タイムアウト付きfetch（AbortSignalは使わない：プレビュー環境などで "could not be cloned" になるため） */
function fetchT(url, opts, ms){
  let timer;
  const timeout = new Promise((_, ng) => {
    timer = setTimeout(() => { const e = new Error("timeout"); e.name = "AbortError"; ng(e); }, ms);
  });
  return Promise.race([fetch(url, opts), timeout]).finally(() => clearTimeout(timer));
}

async function load(){
  if(!GAS_URL) throw new Error("GAS_URL が設定されていません");
  const res = await fetchT(`${GAS_URL}?mode=admin&key=${encodeURIComponent(adminKey())}`, { cache:"no-store" }, 20000);
  if(!res.ok) throw new Error("HTTP " + res.status);
  const r = await res.json();
  if(!r.ok && r.error === "auth"){
    const k = prompt("管理キーを入力してください");
    if(!k) throw new Error("管理キーが必要です");
    try{ localStorage.setItem(KEY_STORE, k); }catch(e){}
    return load();
  }
  if(!r.ok) throw new Error(r.message || "読み込みに失敗しました");
  DATA = r.data;
  return true;
}


/* ---------- 処理中オーバーレイ（書き込み中は操作を受け付けない） ---------- */
let busyDepth = 0;
const busyBlock = e => { e.preventDefault(); e.stopPropagation(); };
function showBusy(msg){
  if(++busyDepth > 1){ document.getElementById("busy-msg").textContent = msg || "処理しています…"; return; }
  document.getElementById("busy-msg").textContent = msg || "処理しています…";
  document.getElementById("busy").classList.add("on");
  try{ if(document.activeElement) document.activeElement.blur(); }catch(e){}
  ["keydown","keypress","keyup"].forEach(t => document.addEventListener(t, busyBlock, true));
}
function hideBusy(){
  if(busyDepth === 0 || --busyDepth > 0) return;
  document.getElementById("busy").classList.remove("on");
  ["keydown","keypress","keyup"].forEach(t => document.removeEventListener(t, busyBlock, true));
}
window.addEventListener("pageshow", () => { busyDepth = 1; hideBusy(); });   // LINEから戻ったときに残らないように

async function update(target, no, value){
  if(!GAS_URL){ toast("GAS_URL が設定されていません", true); return false; }
  showBusy("保存しています…");
  try{
    const res = await fetchT(GAS_URL, {
      method:"POST",
      body: JSON.stringify({ type:"update", target, no, value, key: adminKey() })
    }, 30000);
    const r = await res.json();
    if(!r.ok){ toast(r.message || "更新できませんでした", true); return false; }
    return true;
  }finally{ hideBusy(); }
}

/* ---------- 画面 ---------- */
function renderVisit(){
  const v = DATA.visit;
  const cap = v.slots.reduce((a,s) => a + s.capacity, 0);

  const kpi = `
    <div class="kpis">
      <div class="kpi"><p class="l">予約人数</p><p class="v">${v.total}</p><p class="s">定員 ${cap} 名</p></div>
      <div class="kpi"><p class="l">予約組数</p><p class="v">${v.groups}</p><p class="s">組</p></div>
      <div class="kpi"><p class="l">空き</p><p class="v">${Math.max(0, cap - v.total)}</p><p class="s">名</p></div>
      <div class="kpi"><p class="l">取消</p><p class="v">${v.cancelled}</p><p class="s">件</p></div>
    </div>`;

  const slots = v.slots.map(s => {
    const used = s.capacity - s.left;
    const pct = s.capacity ? Math.min(100, Math.round(used / s.capacity * 100)) : 0;
    return `
      <div class="slotcard">
        <div class="row1">
          <div><h3>${esc(s.label)}</h3><p class="time">${esc(s.time || "")}</p></div>
          <div class="nums"><b>${used}</b><span>／${s.capacity}名　残り${s.left}</span></div>
        </div>
        <div class="gauge ${s.left <= 0 ? "full" : ""}"><i style="width:${pct}%"></i></div>
        <div class="ages">
          <span class="age">組数<b>${s.groups}</b></span>
          ${v.ageKeys.map(k => `<span class="age">${k}<b>${s.ages[k] || 0}</b></span>`).join("")}
        </div>
      </div>`;
  }).join("");

  const ages = `
    <div class="ages" style="margin-top:14px">
      ${v.ageKeys.map(k => `<span class="age">${k}<b>${v.ageTotals[k] || 0}</b></span>`).join("")}
    </div>`;

  const rows = v.rows.map(r => `
    <tr class="${r.status === "キャンセル" ? "off" : ""}" data-search="${esc(r.no + r.name + r.slot)}">
      <td class="no">${esc(r.no)}</td>
      <td>${esc(r.name)}</td>
      <td>${esc(r.slot)}</td>
      <td class="num">${r.total}</td>
      <td>${v.ageKeys.map(k => r.ages[k] ? `${k.slice(0,1)}${r.ages[k]}` : "").filter(Boolean).join(" ")}</td>
      <td class="wrapcell">${esc(r.memo)}</td>
      <td>${r.at}</td>
      <td><button class="mini ${r.status === "キャンセル" ? "" : "warn"}"
            data-act="visit" data-no="${esc(r.no)}"
            data-val="${r.status === "キャンセル" ? "確定" : "キャンセル"}">
            ${r.status === "キャンセル" ? "戻す" : "取消"}</button></td>
    </tr>`).join("");

  document.getElementById("p-visit").innerHTML = `
    <section class="sec">
      <div class="sec-head"><i class="chip"></i><h2>SUMMARY</h2><small>来場予約の集計</small></div>
      ${kpi}${ages}
    </section>
    <section class="sec">
      <div class="sec-head"><i class="chip"></i><h2>TIME</h2><small>時間帯ごと</small></div>
      ${slots || '<p class="empty">時間帯が設定されていません。</p>'}
    </section>
    <section class="sec">
      <div class="sec-head"><i class="chip"></i><h2>LIST</h2><small>予約一覧</small></div>
      <input class="search" id="vsearch" type="search" placeholder="予約番号・お名前で絞り込む">
      <div class="tablewrap">
        <table>
          <thead><tr><th>予約番号</th><th>代表者</th><th>時間帯</th><th>人数</th><th>内訳</th><th>連絡事項</th><th>受付</th><th></th></tr></thead>
          <tbody id="vbody">${rows}</tbody>
        </table>
      </div>
      ${v.rows.length ? "" : '<p class="empty">まだ予約はありません。</p>'}
    </section>`;

  bindSearch("vsearch", "vbody");
  bindActions();
}

function renderOrder(){
  const o = DATA.order;

  const kpi = `
    <div class="kpis">
      <div class="kpi"><p class="l">注文件数</p><p class="v">${o.count}</p><p class="s">件 ／ ${o.itemCount}点</p></div>
      <div class="kpi"><p class="l">売上（予定）</p><p class="v" style="font-size:21px">${yen(o.sales)}</p><p class="s">全注文の合計</p></div>
      <div class="kpi"><p class="l">清算済</p><p class="v">${o.paidCount}</p><p class="s">${yen(o.paidAmount)}</p></div>
      <div class="kpi ${o.unpaidCount ? "alert" : ""}"><p class="l">未清算</p><p class="v">${o.unpaidCount}</p><p class="s">${yen(o.unpaidAmount)}</p></div>
      <div class="kpi"><p class="l">未受取</p><p class="v">${o.notReceived}</p><p class="s">件</p></div>
      <div class="kpi"><p class="l">取消</p><p class="v">${o.cancelled || 0}</p><p class="s">件</p></div>
    </div>`;

  /* 販売元別の精算（ふわこっぺ / エース体操クラブ） */
  const sp = splitOf(o);
  const vsplit = `
    <div class="tablewrap" style="margin-top:14px">
      <table class="vsplit">
        <thead><tr><th>販売元</th><th>点数</th><th>売上（予定）</th><th>清算済</th><th>未清算</th></tr></thead>
        <tbody>
          <tr class="fuwa"><td class="vn">ふわこっぺ</td><td class="num">${sp.fuwa.items}</td>
            <td class="num">${yen(sp.fuwa.sales)}</td><td class="num" style="font-weight:900">${yen(sp.fuwa.paid)}</td>
            <td class="num">${yen(sp.fuwa.unpaid)}</td></tr>
          <tr class="ace"><td class="vn">エース体操クラブ</td><td class="num">${sp.ace.items}</td>
            <td class="num">${yen(sp.ace.sales)}</td><td class="num">${yen(sp.ace.paid)}</td>
            <td class="num">${yen(sp.ace.unpaid)}</td></tr>
          <tr><td class="vn">合計</td><td class="num">${o.itemCount}</td><td class="num">${yen(o.sales)}</td>
            <td class="num">${yen(o.paidAmount)}</td><td class="num">${yen(o.unpaidAmount)}</td></tr>
        </tbody>
      </table>
    </div>
    <p class="hint">ふわこっぺへの入金額は「ふわこっぺ」行の金額です（清算済＝受付で受け取り済みの分、売上（予定）＝取消を除く全注文の分）。</p>`;

  const tallyTable = (list, label) => {
    const qty = list.reduce((a, t) => a + t.qty, 0), amt = list.reduce((a, t) => a + t.amount, 0);
    return `
    <div class="tablewrap">
      <table>
        <thead><tr><th>メニュー</th><th>個数</th><th>単価</th><th>金額</th></tr></thead>
        <tbody>
          ${list.map(t => `
            <tr><td>${esc(t.name)}</td><td class="num">${t.qty}</td>
                <td class="num">${t.price ? yen(t.price) : "―"}</td>
                <td class="num">${t.amount ? yen(t.amount) : "―"}</td></tr>`).join("")}
          <tr><td style="font-weight:900">${label}</td>
              <td class="num" style="font-weight:900">${qty}</td><td></td>
              <td class="num" style="font-weight:900">${yen(amt)}</td></tr>
        </tbody>
      </table>
    </div>`;
  };
  const tFuwa = o.tally.filter(t => !t.ace), tAce = o.tally.filter(t => t.ace);
  const tally = o.tally.length ? `
    <h3 class="subh">ふわこっぺ</h3>
    ${tFuwa.length ? tallyTable(tFuwa, "ふわこっぺ 計") : '<p class="empty">注文はありません。</p>'}
    <h3 class="subh ace">エース体操クラブ販売</h3>
    ${tAce.length ? tallyTable(tAce, "エース体操クラブ 計") : '<p class="empty">注文はありません。</p>'}`
    : '<p class="empty">まだ注文はありません。</p>';

  const rows = o.rows.map(r => {
    const dead = (r.status || "確定") === "キャンセル";
    return `
    <tr class="${dead ? "off" : ""}" data-search="${esc(r.no + r.name + r.tel)}">
      <td class="no">${esc(r.no)}</td>
      <td>${esc(r.name)}</td>
      <td class="num">${r.count}</td>
      <td class="num">${yen(r.total)}</td>
      <td class="num">${yen(r.fuwa ?? r.total)}</td>
      <td class="num">${r.ace ? yen(r.ace) : "―"}</td>
      <td class="wrapcell">${esc(r.detail)}</td>
      <td>${dead ? '<span class="pill no">取消済</span>'
                 : `<span class="pill ${r.paid ? "yes" : "no"}">${r.paid ? "清算済" : "未清算"}</span>`}</td>
      <td>${dead ? "" : `<button class="mini ${r.paid ? "" : "warn"}" data-act="pay" data-no="${esc(r.no)}"
            data-val="${r.paid ? "未払" : "支払済"}">${r.paid ? "未清算に戻す" : "清算済にする"}</button>`}</td>
      <td>${dead ? "" : `<button class="mini" data-act="receive" data-no="${esc(r.no)}"
            data-val="${r.received ? "未受取" : "受取済"}">${r.received ? "受取を戻す" : "受取済にする"}</button>`}</td>
      <td><button class="mini ${dead ? "" : "warn"}" data-act="order" data-no="${esc(r.no)}"
            data-val="${dead ? "確定" : "キャンセル"}">${dead ? "取消を戻す" : "注文取消"}</button></td>
      <td>${dead ? "" : `<button class="mini" data-doc="${esc(r.no)}">PDF</button>`}</td>
      <td>${r.at}</td>
    </tr>`;
  }).join("");

  document.getElementById("p-order").innerHTML = `
    <section class="sec">
      <div class="sec-head"><i class="chip"></i><h2>SUMMARY</h2><small>注文の集計</small></div>
      ${kpi}
      ${vsplit}
    </section>
    <section class="sec">
      <div class="sec-head"><i class="chip"></i><h2>ITEMS</h2><small>発注書（メニュー別の必要数）</small></div>
      <button class="xlsx" id="export-xlsx">発注書・精算表をExcelで出力する</button>
      ${tally}
    </section>
    <section class="sec">
      <div class="sec-head"><i class="chip"></i><h2>LIST</h2><small>注文一覧</small></div>
      <input class="search" id="osearch" type="search" placeholder="注文番号・お名前で絞り込む">
      <button class="pdfbtn" id="export-pdf">注文書・領収書をPDFで出力する（表示中の注文）</button>
      <div class="tablewrap">
        <table>
          <thead><tr><th>注文番号</th><th>お名前</th><th>点数</th><th>金額</th><th>うちふわこっぺ</th><th>うちエース</th><th>明細</th><th>清算</th><th></th><th></th><th></th><th>書類</th><th>受付</th></tr></thead>
          <tbody id="obody">${rows}</tbody>
        </table>
      </div>
      ${o.rows.length ? "" : '<p class="empty">まだ注文はありません。</p>'}
      <p class="hint">受付での流れ：注文番号で絞り込む →　金額を確認 →　「清算済にする」を押す。商品を渡したら「受取済にする」。</p>
      <p class="hint">PDF：上の青いボタンは、絞り込みで表示中の注文（取消を除く）をまとめて出力します。1件だけなら各行の「PDF」。A4の上半分が注文書、下半分が領収書です（点線で切り離し）。印刷画面の送信先で「PDFに保存」を選ぶとPDFになります。</p>
    </section>`;

  bindSearch("osearch", "obody");
  bindActions();
  const xb = document.getElementById("export-xlsx");
  if(xb) xb.onclick = exportXlsx;

  const pb = document.getElementById("export-pdf");
  if(pb) pb.onclick = () => {
    // 絞り込みで表示中の行だけ（取消は除く）
    const shown = new Set([...document.querySelectorAll("#obody tr")]
      .filter(tr => tr.style.display !== "none").map(tr => tr.querySelector(".no")?.textContent));
    const list = o.rows.filter(r => shown.has(r.no) && (r.status || "確定") !== "キャンセル");
    if(!list.length){ toast("出力できる注文がありません", true); return; }
    openOrderDocs(list);
  };
  document.querySelectorAll("button[data-doc]").forEach(b => {
    b.onclick = () => {
      const r = o.rows.find(x => x.no === b.dataset.doc);
      if(r) openOrderDocs([r]);
    };
  });
}

/** 販売元別の集計（古いGASで split が無い場合は全額ふわこっぺとして扱う） */
function splitOf(o){
  if(o.split) return o.split;
  return { fuwa:{ sales:o.sales, paid:o.paidAmount, unpaid:o.unpaidAmount, items:o.itemCount },
           ace:{ sales:0, paid:0, unpaid:0, items:0 } };
}

/* ---------- 発注書のExcel出力 ---------- */
function exportXlsx(){
  if(typeof XLSX === "undefined"){ toast("Excel機能を読み込めませんでした", true); return; }

  const o = DATA.order, c = DATA.config;
  const now = new Date();
  const stamp = `${now.getFullYear()}/${now.getMonth()+1}/${now.getDate()} ` +
                `${String(now.getHours()).padStart(2,"0")}:${String(now.getMinutes()).padStart(2,"0")}`;

  // メニュー全件に注文数を突き合わせる（0個の商品も残して発注漏れを防ぐ）
  const qtyOf = {};
  o.tally.forEach(t => qtyOf[t.name] = t.qty);
  const base = (o.menu && o.menu.length)
    ? o.menu.map(m => ({ name:m.name, price:m.price, qty:qtyOf[m.name] || 0, ace:!!m.ace }))
    : o.tally.map(t => ({ name:t.name, price:t.price, qty:t.qty, ace:!!t.ace }));
  // メニューにない商品（過去メニューなど）も拾う
  o.tally.forEach(t => { if(!base.some(b => b.name === t.name)) base.push({ name:t.name, price:t.price, qty:t.qty, ace:!!t.ace }); });

  const info = [
    ["イベント", c.eventName || ""],
    ["開催日",   c.eventDate || ""],
    ["会場",     c.venue || ""],
    ["出力日時", stamp],
    ["注文件数", `${o.count}件（キャンセル${o.cancelled || 0}件を除く）`]
  ];

  /* 発注書シートを作る（販売元ごと） */
  const orderSheet = (title, items) => {
    const head = [[title], [], ...info, [], ["No", "メニュー名", "単価", "必要数", "金額"]];
    const startRow = head.length + 1;               // データ開始行（1始まり）
    const rows = items.map((b, i) => [i + 1, b.name, b.price, b.qty, { f: `C${startRow+i}*D${startRow+i}` }]);
    const endRow = startRow + Math.max(items.length, 1) - 1;
    const total = ["", "合計", "",
      { f: `SUM(D${startRow}:D${endRow})` },
      { f: `SUM(E${startRow}:E${endRow})` }];
    const ws = XLSX.utils.aoa_to_sheet([...head, ...(rows.length ? rows : [["", "（注文なし）", 0, 0, 0]]), total]);
    ws["!cols"] = [{wch:5},{wch:26},{wch:9},{wch:9},{wch:12}];
    for(let r = startRow; r <= endRow + 1; r++){
      ["C","E"].forEach(col => { const cell = ws[col + r]; if(cell) cell.z = '#,##0'; });
    }
    return ws;
  };
  const wsFuwa = orderSheet("ふわこっぺ　発注書", base.filter(b => !b.ace));
  const wsAce  = orderSheet("エース体操クラブ販売　集計", base.filter(b => b.ace));

  /* --- 精算シート：販売元別の金額（ふわこっぺへの入金額） --- */
  const sp = splitOf(o);
  const settle = [
    ["販売元別　精算表"], [], ...info, [],
    ["販売元", "点数", "売上（予定）", "清算済", "未清算"],
    ["ふわこっぺ",       sp.fuwa.items, sp.fuwa.sales, sp.fuwa.paid, sp.fuwa.unpaid],
    ["エース体操クラブ", sp.ace.items,  sp.ace.sales,  sp.ace.paid,  sp.ace.unpaid],
    ["合計", o.itemCount, o.sales, o.paidAmount, o.unpaidAmount],
    [],
    ["ふわこっぺへの入金額（清算済分）", "", sp.fuwa.paid],
    ["ふわこっぺへの入金額（全注文分）", "", sp.fuwa.sales],
    ["※清算済＝受付で代金を受け取った注文。全注文分＝キャンセルを除くすべての注文。"]
  ];
  const ws0 = XLSX.utils.aoa_to_sheet(settle);
  ws0["!cols"] = [{wch:32},{wch:8},{wch:13},{wch:13},{wch:13}];
  Object.keys(ws0).forEach(k => { const cell = ws0[k]; if(cell && typeof cell.v === "number" && /^[C-E]/.test(k)) cell.z = '#,##0'; });

  /* --- 注文一覧 --- */
  const list = [["注文番号","お名前","電話番号","点数","金額","うちふわこっぺ","うちエース","明細","支払","受取","状況","受付日時"]];
  o.rows.forEach(r => list.push([
    r.no, r.name, r.tel, r.count, r.total, r.fuwa ?? r.total, r.ace || 0, r.detail,
    r.paid ? "支払済" : "未払",
    r.received ? "受取済" : "未受取",
    r.status || "確定", r.at
  ]));
  const ws2 = XLSX.utils.aoa_to_sheet(list);
  ws2["!cols"] = [{wch:11},{wch:16},{wch:14},{wch:6},{wch:10},{wch:13},{wch:11},{wch:46},{wch:8},{wch:8},{wch:10},{wch:12}];
  ws2["!autofilter"] = { ref: `A1:L${list.length}` };

  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws0,    "精算（販売元別）");
  XLSX.utils.book_append_sheet(wb, wsFuwa, "ふわこっぺ発注書");
  XLSX.utils.book_append_sheet(wb, wsAce,  "エース体操クラブ");
  XLSX.utils.book_append_sheet(wb, ws2,    "注文一覧");

  const fn = `ACE-EXPO_発注書_${now.getFullYear()}${String(now.getMonth()+1).padStart(2,"0")}${String(now.getDate()).padStart(2,"0")}.xlsx`;
  XLSX.writeFile(wb, fn);
  toast("発注書を出力しました");
}

/* ---------- 注文書・領収書（A4＝上：注文書A5／下：領収書A5） ---------- */
function openOrderDocs(list){
  const o = DATA.order, c = DATA.config;
  // 商品名 → 単価・販売元（表示中メニュー＋集計にある過去メニュー）
  const info = {};
  (o.tally || []).forEach(t => info[t.name] = { price:t.price, ace:!!t.ace });
  (o.menu  || []).forEach(m => info[m.name] = { price:m.price, ace:!!m.ace });

  const parse = detail => String(detail || "").split("/").map(x => x.trim()).filter(Boolean).map(x => {
    const i = x.lastIndexOf("×");
    const name = i < 0 ? x : x.slice(0, i).trim(), qty = i < 0 ? 1 : Number(x.slice(i + 1)) || 0;
    const m = info[name] || { price:0, ace:false };
    return { name, qty, price:m.price, sub:m.price * qty, ace:m.ace };
  });
  const sorted = [...list].sort((a, b) => String(a.no).localeCompare(String(b.no), "ja", { numeric:true }));

  const page = r => {
    const items = parse(r.detail);
    const fuwa = items.filter(i => !i.ace), ace = items.filter(i => i.ace);
    const fuwaAmt = r.fuwa ?? (r.total - (r.ace || 0)), aceAmt = r.ace || 0;
    const lineRows = (arr, vendor) => arr.map(i => `
      <tr><td class="v">${vendor}</td><td>${esc(i.name)}</td>
          <td class="n">${i.price ? yen(i.price) : "―"}</td><td class="n">${i.qty}</td>
          <td class="n">${i.price ? yen(i.sub) : "―"}</td></tr>`).join("");
    const many = items.length > 8 ? " many" : "";
    const ck = on => on ? "☑" : "☐";

    return `
    <section class="page">
      <div class="half order${many}">
        <div class="hd">
          <div><p class="ttl">注 文 書</p>
               <p class="ev">${esc(c.eventEn || "ACE EXPO")}　ふわこっぺ注文${c.eventDate ? "　｜　" + esc(c.eventDate) : ""}</p></div>
          <div class="nobox"><span>注文番号</span><b>${esc(r.no)}</b></div>
        </div>
        <div class="who">
          <p class="name">${esc(r.name)}<small>様</small></p>
          <p class="meta">${r.tel ? "TEL " + esc(r.tel) + "　" : ""}受付 ${esc(r.at)}</p>
        </div>
        <table class="items">
          <thead><tr><th class="v">販売元</th><th>品名</th><th class="n">単価</th><th class="n">数量</th><th class="n">金額</th></tr></thead>
          <tbody>
            ${lineRows(fuwa, "ふわこっぺ")}
            ${fuwa.length && ace.length ? `<tr class="sub"><td colspan="4">ふわこっぺ　小計</td><td class="n">${yen(fuwaAmt)}</td></tr>` : ""}
            ${lineRows(ace, "エース体操クラブ")}
            ${fuwa.length && ace.length ? `<tr class="sub ace"><td colspan="4">エース体操クラブ　小計</td><td class="n">${yen(aceAmt)}</td></tr>` : ""}
          </tbody>
          <tfoot><tr><td colspan="3">合計</td><td class="n">${r.count}点</td><td class="n">${yen(r.total)}</td></tr></tfoot>
        </table>
        <div class="foot">
          <p class="memo">${r.memo ? "連絡事項：" + esc(r.memo) : ""}</p>
          <p class="checks">${ck(r.paid)} 清算済　　${ck(r.received)} 受取済</p>
        </div>
      </div>

      <div class="cut"><span>✂ きりとり</span></div>

      <div class="half receipt">
        <div class="rhd">
          <p class="ttl">領 収 書</p>
          <p class="rno">No. ${esc(r.no)}<br>　　　　年　　月　　日</p>
        </div>
        <p class="to">${esc(r.name)}<small>様</small></p>
        <div class="amt"><span>金額</span><b>${yen(r.total)}<i>－</i></b><small>（税込）</small></div>
        <p class="tadashi">但し　${esc(c.eventEn || "ACE EXPO")} 飲食代として<br>上記正に領収いたしました。</p>
        <div class="rbottom">
          <table class="bd">
            <tr><th colspan="2">内訳</th></tr>
            <tr><td>ふわこっぺ</td><td class="n">${yen(fuwaAmt)}</td></tr>
            ${aceAmt ? `<tr><td>エース体操クラブ</td><td class="n">${yen(aceAmt)}</td></tr>` : ""}
          </table>
          <div class="issuer">
            <p class="org">${esc(c.eventName || "")}</p>
            <p class="addr">${esc(c.venue || "")}</p>
            <div class="stamp">印</div>
          </div>
        </div>
      </div>
    </section>`;
  };

  .amt b{flex:1;text-align:center;font-size:27pt;font-weight:900;letter-spacing:.04em}
  .amt b i{font-style:normal;margin-left:1mm}

  .tadashi{margin:4.5mm 0 0 22mm;font-size:10pt;line-height:1.8}
  .rbottom{position:absolute;left:15mm;right:15mm;bottom:9mm;display:flex;justify-content:space-between;align-items:flex-end}
  .bd{width:72mm}
  .bd th{font-size:8pt;text-align:left;padding:1mm 2mm;background:#EEF0F3}
  .bd td{font-size:9.5pt;padding:1.1mm 2mm;border-bottom:.4pt solid #C9CDD4}
  .issuer{position:relative;text-align:right;padding-right:20mm;min-height:18mm}

  .stamp{position:absolute;right:0;top:-1mm;width:17mm;height:17mm;border:.6pt solid #AAA;border-radius:50%;
    display:grid;place-items:center;font-size:8pt;color:#AAA}
  @media print{
    html,body{background:#fff}
    .bar{display:none}

  }`;

  const first = sorted[0].no, last = sorted[sorted.length - 1].no;
  const title = `ACE-EXPO_注文書領収書_${first}${sorted.length > 1 ? "-" + last : ""}`;
  const html = `<!doctype html><html lang="ja"><head><meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>${esc(title)}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>${css}</style></head><body>
    <div class="bar"><span>${sorted.length}件（A4 ${sorted.length}枚）</span>
      <button onclick="print()">PDFに保存／印刷</button>
      <span>印刷画面の送信先で「PDFに保存」を選んでください</span></div>
    ${sorted.map(page).join("")}
    <script>
      // フォントの読み込みを待ってから印刷画面を開く（最大3秒）
      Promise.race([document.fonts.ready, new Promise(ok => setTimeout(ok, 3000))])
        .then(() => setTimeout(() => print(), 300));
    <\/script></body></html>`;

  const w = window.open("", "_blank");
  if(!w){ toast("ポップアップがブロックされました。許可してからもう一度押してください", true); return; }
  w.document.open(); w.document.write(html); w.document.close();
}

/* ---------- 部品 ---------- */
function bindSearch(inputId, bodyId){
  const inp = document.getElementById(inputId);
  if(!inp) return;
  inp.oninput = () => {
    const q = inp.value.trim().toLowerCase();
    document.getElementById(bodyId).querySelectorAll("tr").forEach(tr => {
      tr.style.display = !q || (tr.dataset.search || "").toLowerCase().includes(q) ? "" : "none";
    });
  };
}

function bindActions(){
  document.querySelectorAll("button[data-act]").forEach(b => {
    b.onclick = async () => {
      const label = b.textContent;
      b.disabled = true; b.textContent = "更新中…";
      const ok = await update(b.dataset.act, b.dataset.no, b.dataset.val);
      if(ok){ toast("更新しました"); await refresh(); }
      else { b.disabled = false; b.textContent = label; }
    };
  });
}

let toastTimer = null;
function toast(msg, bad){
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.toggle("bad", !!bad);
  t.classList.add("on");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("on"), 2200);
}

function renderAll(){
  document.getElementById("mark").firstChild.nodeValue = DATA.config.eventEn || "ACE EXPO";
  document.getElementById("mark-sub").textContent = "管理ページ";
  document.getElementById("stamp").textContent = "最終更新 " + (DATA.updatedAt || "");
  renderVisit(); renderOrder(); renderConfig();
}

async function refresh(){
  const btn = document.getElementById("reload");
  btn.disabled = true; btn.textContent = "更新中…";
  showBusy("更新しています…");
  try{ await load(); renderAll(); }
  catch(e){
    toast(e.message || "読み込みに失敗しました", true);
    if(DATA) document.getElementById("stamp").textContent = "⚠ 更新に失敗しました。表示は古い情報です（最終更新 " + (DATA.updatedAt || "") + "）";
  }
  finally{ hideBusy(); }
  btn.disabled = false; btn.textContent = "更新";
}

function switchTab(which){
  ["visit","order","config"].forEach(k => {
    document.getElementById("t-" + k).setAttribute("aria-selected", k === which);
    document.getElementById("p-" + k).hidden = k !== which;
  });
  window.scrollTo(0, 0);
}
["visit","order","config"].forEach(k => {
  document.getElementById("t-" + k).onclick = () => switchTab(k);
});
document.getElementById("reload").onclick = refresh;

/* ---------- 起動 ---------- */
async function start(){
  document.getElementById("loaderr").classList.remove("on");
  showBusy("読み込んでいます…");
  try{
    await load();
    renderAll();
    document.body.style.overflow = "";
  }catch(e){
    console.warn("読み込み失敗", e);
    document.getElementById("loaderr").classList.add("on");
    document.body.style.overflow = "hidden";
  }finally{ hideBusy(); }
}
document.getElementById("loaderr-retry").onclick = start;
start();
</script>
